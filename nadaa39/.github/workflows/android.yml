name: Build Android
on: [workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: cd apps/web && npm install && npm run build
      - run: npm install -g @capacitor/cli @capacitor/assets && npx cap add android || true
      - run: npx @capacitor/assets generate
      - run: ./scripts_patch_mobile.sh
      - run: npx cap copy android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: nadaa39-android-debug, path: android/app/build/outputs/apk/debug/*.apk}
